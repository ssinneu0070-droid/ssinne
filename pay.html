<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>씬느샵 카드결제</title>
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6fa;color:#222;font-family:Arial,"Noto Sans KR",sans-serif}.top{background:linear-gradient(135deg,#ff5ba8,#ff93c5);color:#fff;padding:26px 16px;text-align:center}.top h1{margin:0;font-size:25px}.top p{margin:7px 0 0;font-size:14px}.wrap{max-width:560px;margin:20px auto;padding:0 14px 40px}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 5px 18px rgba(0,0,0,.08)}.amount>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:16px}.amount .extra{color:#d83c79}.amount .final{border-top:2px solid #f4d8e5;margin-top:6px;padding-top:15px;font-size:21px;font-weight:900}.notice{background:#fff0f6;border:1px solid #ffd0e3;border-radius:14px;padding:13px;font-size:14px;line-height:1.55;margin-top:12px}.btn{width:100%;border:0;border-radius:15px;padding:17px;font-size:18px;font-weight:900;cursor:pointer;background:#ff4f9e;color:#fff}.btn:disabled{opacity:.5}.center{text-align:center}.state{font-size:20px;font-weight:900;margin:10px 0}.small{font-size:13px;color:#777;line-height:1.55}.error{color:#b32452}.success{color:#138a5b}.hide{display:none}
</style>
</head>
<body>
<div class="top"><h1>💗 씬느샵 카드결제</h1><p>토스페이먼츠 안전결제</p></div>
<div class="wrap">
  <div id="loadingCard" class="card center"><div class="state">결제정보를 확인하고 있습니다.</div><div class="small">잠시만 기다려주세요.</div></div>
  <div id="payCard" class="hide">
    <div class="card amount"><div><span>기본 주문금액</span><strong id="baseAmount">0원</strong></div><div class="extra"><span>카드결제 추가금액 (10%)</span><strong id="extraAmount">0원</strong></div><div class="final"><span>최종 결제금액</span><strong id="finalAmount">0원</strong></div><div class="notice">결제하기 전에 최종 금액을 확인해주세요. 결제 인증 후 씬느샵 서버에서 금액과 주문번호를 다시 확인한 뒤 승인합니다.</div></div>
    <div class="card"><div id="payment-method"></div><div id="agreement"></div></div>
    <button id="payButton" class="btn" type="button">카드 / 간편결제로 결제하기</button>
  </div>
  <div id="resultCard" class="card center hide"><div id="resultTitle" class="state"></div><div id="resultText" class="small"></div></div>
</div>
<script>
const q=new URLSearchParams(location.search),token=q.get('token')||'',api=q.get('api')||'',mode=q.get('mode')||'';
const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const showResult=(ok,title,text)=>{document.getElementById('loadingCard').classList.add('hide');document.getElementById('payCard').classList.add('hide');const c=document.getElementById('resultCard');c.classList.remove('hide');document.getElementById('resultTitle').className='state '+(ok?'success':'error');document.getElementById('resultTitle').textContent=title;document.getElementById('resultText').textContent=text;};
async function getSession(){if(!token||!api)throw new Error('결제링크 정보가 없습니다. 판매자에게 새 링크를 요청해주세요.');const u=new URL(api);u.searchParams.set('action','tossPaymentSession');u.searchParams.set('token',token);const r=await fetch(u.toString());const d=await r.json();if(!d.success)throw new Error(d.message||'결제정보를 불러오지 못했습니다.');return d;}
async function confirmPayment(){try{const paymentKey=q.get('paymentKey'),orderId=q.get('orderId'),amount=Number(q.get('amount')||0);if(!paymentKey||!orderId||!amount)throw new Error('결제 승인정보가 부족합니다.');document.getElementById('loadingCard').querySelector('.state').textContent='결제를 최종 승인하고 있습니다.';const r=await fetch(api,{method:'POST',body:JSON.stringify({action:'tossConfirmPayment',token,paymentKey,orderId,amount}),redirect:'follow'});const d=await r.json();if(!d.success)throw new Error(d.message||'결제 승인에 실패했습니다.');showResult(true,'✅ 결제가 완료되었습니다.','씬느샵에 카드결제완료로 자동 반영되었습니다. 이 화면을 닫으셔도 됩니다.');}catch(e){showResult(false,'결제를 완료하지 못했습니다.',e.message+' 판매자에게 문의해주세요.');}}
async function start(){
  if(mode==='success')return confirmPayment();
  if(mode==='fail'){const msg=q.get('message')||'결제가 취소되었거나 인증에 실패했습니다.';return showResult(false,'결제가 완료되지 않았습니다.',msg+' 다시 결제하려면 기존 링크를 다시 열어주세요.');}
  try{const s=await getSession();if(s.paid)return showResult(true,'✅ 이미 결제가 완료되었습니다.','같은 주문을 다시 결제할 필요가 없습니다.');
    document.getElementById('baseAmount').textContent=money(s.baseTotal);document.getElementById('extraAmount').textContent=money(s.cardExtraAmount);document.getElementById('finalAmount').textContent=money(s.amount);
    const toss=TossPayments(s.clientKey),widgets=toss.widgets({customerKey:s.customerKey||'ANONYMOUS'});await widgets.setAmount({currency:'KRW',value:Number(s.amount)});await Promise.all([widgets.renderPaymentMethods({selector:'#payment-method',variantKey:'DEFAULT'}),widgets.renderAgreement({selector:'#agreement',variantKey:'AGREEMENT'})]);
    document.getElementById('loadingCard').classList.add('hide');document.getElementById('payCard').classList.remove('hide');
    document.getElementById('payButton').onclick=async()=>{const b=document.getElementById('payButton');b.disabled=true;try{const base=location.origin+location.pathname,common='token='+encodeURIComponent(token)+'&api='+encodeURIComponent(api);await widgets.requestPayment({orderId:s.orderId,orderName:s.orderName||'씬느샵 주문',successUrl:base+'?mode=success&'+common,failUrl:base+'?mode=fail&'+common,customerName:s.customerName||undefined,customerMobilePhone:s.customerMobilePhone||undefined});}catch(e){b.disabled=false;alert(e.message||'결제창을 열지 못했습니다.');}};
  }catch(e){showResult(false,'결제정보를 불러오지 못했습니다.',e.message);}
}
start();
</script>
</body></html>
