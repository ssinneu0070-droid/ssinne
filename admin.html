<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>씬느샵 V3 Pro 관리자</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand">♥ 씬느샵 V3 Pro</div>
  <button class="nav-btn active" onclick="openTab('dashboard',this)">대시보드</button>
  <button class="nav-btn" onclick="openTab('orders',this)">주문관리</button>
  <button class="nav-btn" onclick="openTab('products',this)">상품관리</button>
  <button class="nav-btn" onclick="openTab('vendor',this)">거래처발주</button>
  <button class="nav-btn" onclick="openTab('shipping',this)">3PL출고</button>
  <button class="nav-btn" onclick="openTab('cancel',this)">취소주문</button>
  <button class="nav-btn" onclick="openTab('history',this)">전체주문이력</button>
</aside>
<main class="main">
  <div class="admin-head"><div><h1 style="margin:0">씬느샵 관리자</h1><small>실시간 주문 관리 시스템</small></div><button class="btn btn-outline" onclick="refreshCurrent()">새로고침</button></div>
  <section id="dashboard" class="tab"></section>
  <section id="orders" class="tab hidden"></section>
  <section id="products" class="tab hidden"></section>
  <section id="vendor" class="tab hidden"></section>
  <section id="shipping" class="tab hidden"></section>
  <section id="cancel" class="tab hidden"></section>
  <section id="history" class="tab hidden"></section>
</main></div>
<script src="config.js"></script><script src="common.js"></script>
<script>
let current="dashboard";
function openTab(id,btn){
  current=id;document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));
  document.querySelector("#"+id).classList.remove("hidden");
  document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
  load(id);
}
function refreshCurrent(){load(current)}
async function load(id){
  try{
    if(id==="dashboard")return loadDashboard();
    if(id==="orders")return loadList("고객주문","orders");
    if(id==="shipping")return loadList("3PL출고","shipping");
    if(id==="history")return loadList("전체주문이력","history");
    if(id==="cancel")return loadCanceled();
    if(id==="vendor")return loadVendor();
    if(id==="products")return loadProducts();
  }catch(e){toast(e.message,"error")}
}
async function loadDashboard(){
  const r=await api("dashboard",{});
  document.querySelector("#dashboard").innerHTML=`
  <div class="grid grid-4">
   <div class="metric"><div class="label">오늘 주문</div><div class="value">${r.todayCount}건</div></div>
   <div class="metric"><div class="label">미입금</div><div class="value">${r.unpaidCount}건</div></div>
   <div class="metric"><div class="label">출고대기</div><div class="value">${r.shippingCount}건</div></div>
   <div class="metric"><div class="label">오늘 매출</div><div class="value">${money(r.todaySales)}</div></div>
  </div>
  <div class="card"><h2>최근 주문</h2>${cards(r.recentOrders||[])}</div>`;
}
function cards(rows){
 return rows.map(o=>`<div class="order-card"><div class="row"><strong>${escapeHtml(o.nickname)} · ${escapeHtml(o.receiver)}</strong><span>${escapeHtml(o.paymentStatus)}</span></div><div>${escapeHtml(o.orderDate)} · ${money(o.amount)}</div><div style="white-space:pre-line">${escapeHtml(o.purchaseText)}</div></div>`).join("")||"자료가 없습니다.";
}
async function loadList(sheet,target){
 const r=await api("adminList",{sheet,limit:300});
 document.querySelector("#"+target).innerHTML=`<div class="card"><h2>${sheet}</h2>${table(r.rows||[])}</div>`;
}
function table(rows){
 if(!rows.length)return "자료가 없습니다.";
 const keys=Object.keys(rows[0]).filter(k=>!["rowNumber"].includes(k));
 return `<div class="table-wrap"><table><thead><tr>${keys.map(k=>`<th>${escapeHtml(k)}</th>`).join("")}<th>관리</th></tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td style="white-space:pre-line">${escapeHtml(r[k])}</td>`).join("")}<td>${r["입금상태"]?`<select onchange="changeStatus('${escapeHtml(r["주문ID"])}',this.value)"><option>${escapeHtml(r["입금상태"])}</option><option>미입금</option><option>입금완료</option><option>카드결제</option></select>`:""}</td></tr>`).join("")}</tbody></table></div>`;
}
async function changeStatus(orderId,status){
 try{await api("changePaymentStatus",{orderId,status});toast("변경되었습니다.");refreshCurrent()}catch(e){toast(e.message,"error")}
}
async function loadCanceled(){
 const r=await api("adminList",{sheet:"취소주문",limit:300});
 const rows=r.rows||[];
 document.querySelector("#cancel").innerHTML=`<div class="card"><h2>취소주문 관리</h2><div class="table-wrap"><table><thead><tr><th>취소일</th><th>주문ID</th><th>닉네임</th><th>수령인</th><th>연락처</th><th>구매내역</th><th>금액</th><th>사유</th><th>관리</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${escapeHtml(x["취소일"])}</td><td>${escapeHtml(x["주문ID"])}</td><td>${escapeHtml(x["닉네임"])}</td><td>${escapeHtml(x["수령인"])}</td><td>${escapeHtml(x["연락처"])}</td><td style="white-space:pre-line">${escapeHtml(x["구매내역"])}</td><td>${escapeHtml(x["입금금액"])}</td><td>${escapeHtml(x["취소사유"])}</td><td><button class="btn btn-green btn-sm" onclick="restore('${escapeHtml(x["주문ID"])}')">복구</button></td></tr>`).join("")}</tbody></table></div></div>`;
}
async function restore(orderId){if(!confirm("이 주문을 복구하시겠습니까?"))return;try{await api("restoreOrder",{orderId});toast("복구되었습니다.");loadCanceled()}catch(e){toast(e.message,"error")}}
async function loadVendor(){
 const r=await api("vendorSummary",{});
 document.querySelector("#vendor").innerHTML=`<div class="card"><h2>거래처발주</h2>${table(r.rows||[])}</div>`;
}
async function loadProducts(){
 const r=await api("adminList",{sheet:"상품정보",limit:500});
 document.querySelector("#products").innerHTML=`<div class="card"><h2>상품관리</h2><p>상품 등록과 수정은 현재 시트에서 직접 관리하도록 구성했습니다.</p>${table(r.rows||[])}</div>`;
}
load("dashboard");
</script></body></html>
