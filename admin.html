<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>씬느샵 관리자</title>

<style>

body{
    margin:0;
    font-family:sans-serif;
    background:#fff5fa;
}

.admin-wrap{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:230px;
    background:#182338;
    color:white;
    padding:30px 20px;
}

.logo{
    font-size:22px;
    font-weight:800;
    margin-bottom:40px;
}

.menu{
    padding:16px;
    border-radius:14px;
    margin-bottom:12px;
    font-weight:700;
    cursor:pointer;
}

.menu.active{
    background:#ff4fa1;
}

.main{
    flex:1;
    padding:35px;
}

.top-title{
    font-size:28px;
    font-weight:800;
    margin-bottom:30px;
}

.card-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:24px;
    border-radius:18px;
    box-shadow:0 4px 16px rgba(0,0,0,0.05);
}

.card-title{
    color:#ff4fa1;
    font-weight:700;
    margin-bottom:12px;
}

.card-number{
    font-size:28px;
    font-weight:900;
}

.search-row{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.search-row input,
.search-row select{
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:14px;
}

.search-row input{
    width:300px;
}

.search-btn,
.refresh-btn{
    border:none;
    background:#ff4fa1;
    color:white;
    padding:14px 20px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 16px rgba(0,0,0,0.05);
}

th,td{
    padding:14px;
    border-bottom:1px solid #eee;
    font-size:14px;
    text-align:left;
}

th{
    background:#fff0f6;
}

.status{
    padding:8px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
}

.ready{
    background:#fff0c2;
    color:#9a6a00;
}

.shipping{
    background:#dbeafe;
    color:#2563eb;
}

.done{
    background:#dcfce7;
    color:#15803d;
}

@media(max-width:900px){

    .admin-wrap{
        flex-direction:column;
    }

    .sidebar{
        width:auto;
    }

    .card-row{
        grid-template-columns:1fr;
    }

    table{
        font-size:12px;
        display:block;
        overflow-x:auto;
    }

}

</style>
</head>

<body>

<div class="admin-wrap">

    <div class="sidebar">

        <div class="logo">
            🎁 씬느샵 관리자
        </div>

        <div class="menu active">
            📦 주문 관리
        </div>

        <div class="menu">
            📊 주문 통계
        </div>

        <div class="menu">
            ⬇ 엑셀 다운로드
        </div>

        <div class="menu">
            ⚙ 설정
        </div>

    </div>

    <div class="main">

        <div class="top-title">
            주문 관리
        </div>

        <div class="card-row">

            <div class="card">
                <div class="card-title">
                    전체 주문
                </div>

                <div class="card-number" id="totalCount">
                    0건
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    오늘 주문
                </div>

                <div class="card-number" id="todayCount">
                    0건
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    배송 완료
                </div>

                <div class="card-number" id="doneCount">
                    0건
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    대기 중
                </div>

                <div class="card-number" id="readyCount">
                    0건
                </div>
            </div>

        </div>

        <div class="search-row">

            <input
                type="text"
                id="searchInput"
                placeholder="닉네임 / 수령인 / 연락처 검색"
            >

            <button
                class="search-btn"
                onclick="searchOrders()"
            >
                검색
            </button>

            <select
                id="statusFilter"
                onchange="searchOrders()"
            >
                <option value="">
                    전체 상태
                </option>

                <option value="배송 준비중">
                    배송 준비중
                </option>

                <option value="배송중">
                    배송중
                </option>

                <option value="배송완료">
                    배송완료
                </option>
            </select>

            <button
                class="refresh-btn"
                onclick="loadOrders()"
            >
                새로고침
            </button>

        </div>

        <table>

            <thead>

                <tr>

                    <th>주문번호</th>

                    <th>닉네임</th>

                    <th>수령인</th>

                    <th>연락처</th>

                    <th>주소</th>

                    <th>주문일</th>

                    <th>배송메모</th>

                    <th>구매내역</th>

                    <th>상태</th>

                </tr>

            </thead>

            <tbody id="orderList"></tbody>

        </table>

    </div>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyHvO3uGfP35r_XrEuJYT7MHAEtURTVKIVzgWi3JII8cqUqMftd4Bxk6l08KrnjiK9VZA/exec";

let allOrders = [];

async function loadOrders(){

    try{

        const res =
            await fetch(SCRIPT_URL);

        const orders =
            await res.json();

        allOrders = orders;

        renderOrders(allOrders);

        updateCards(allOrders);

    }catch(error){

        console.log(error);

        alert(
            '주문 데이터를 불러오지 못했습니다'
        );

    }

}

function renderOrders(orders){

    const orderList =
        document.getElementById(
            'orderList'
        );

    orderList.innerHTML = '';

    orders.forEach(order => {

        let statusClass = 'ready';

        if(order.status === '배송중'){
            statusClass = 'shipping';
        }

        if(order.status === '배송완료'){
            statusClass = 'done';
        }

        orderList.innerHTML += `

        <tr>

            <td>${order.orderNumber || ''}</td>

            <td>${order.nickname || ''}</td>

            <td>${order.name || ''}</td>

            <td>${order.phone || ''}</td>

            <td>
                ${order.address || ''}
                ${order.detailAddress || ''}
            </td>

            <td>${order.date || ''}</td>

            <td>${order.memo || ''}</td>

            <td>${order.orderItems || ''}</td>

            <td>

                <span class="status ${statusClass}">

                    ${order.status || '배송 준비중'}

                </span>

            </td>

        </tr>

        `;

    });

}

function searchOrders(){

    const keyword =
        document.getElementById(
            'searchInput'
        ).value;

    const status =
        document.getElementById(
            'statusFilter'
        ).value;

    const filtered =
        allOrders.filter(order => {

        const text =
            `${order.nickname}
             ${order.name}
             ${order.phone}
             ${order.orderNumber}`;

        const keywordMatch =
            text.includes(keyword);

        const statusMatch =
            status === '' ||
            order.status === status;

        return keywordMatch &&
               statusMatch;

    });

    renderOrders(filtered);

}

function updateCards(orders){

    document.getElementById(
        'totalCount'
    ).innerText =
        orders.length + '건';

    document.getElementById(
        'todayCount'
    ).innerText =
        orders.length + '건';

    document.getElementById(
        'doneCount'
    ).innerText =
        orders.filter(order =>
            order.status === '배송완료'
        ).length + '건';

    document.getElementById(
        'readyCount'
    ).innerText =
        orders.filter(order =>
            order.status !== '배송완료'
        ).length + '건';

}

loadOrders();

</script>

</body>
</html>
