<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff4f97">
  <title>씬느샵 주문조회</title>
  <link rel="stylesheet" href="style.css?v=20260716-history-independent-final">
  <script src="script.js?v=20260716-history-independent-final" defer></script>
</head>
<body data-page="customer" class="page-customer">
  <header class="brand-header">
    <div class="brand-shell">
      <div class="brand-mark">S</div>
      <div class="brand-copy">
        <h1>씬느샵</h1>
        <p>Order Tracking</p>
      </div>
    </div>
  </header>

  <main class="page-shell lookup-shell">
    <section class="hero-card compact-hero">
      <div>
        <span class="eyebrow">ORDER LOOKUP</span>
        <h2>주문내역 조회</h2>
        <p>오늘 주문과 지난 주문을 함께 검색해 최신순으로 보여드립니다.</p>
      </div>
    </section>

    <section class="lookup-card">
      <div class="form-grid two">
        <div class="field">
          <label for="lookupName">수령인 성함</label>
          <input id="lookupName" type="text" placeholder="예: 유영인">
        </div>

        <div class="field">
          <label for="lookupPhoneLast">연락처 뒤 4자리</label>
          <input id="lookupPhoneLast" type="text" inputmode="numeric"
                 maxlength="4" placeholder="예: 6337">
        </div>
      </div>

      <button type="button" class="btn btn-primary full-width lookup-submit-button" id="lookupButton">
        주문 조회하기
      </button>
    </section>

    <section id="lookupResultSection" class="lookup-results">
      <div class="result-head">
        <div>
          <span class="eyebrow">MY ORDERS</span>
          <h2>주문내역</h2>
        </div>
        <span class="result-count" id="lookupCount">0건</span>
      </div>

      <div id="customerOrderList">
        <div class="empty-state">
          수령인 성함과 연락처 뒤 4자리를 입력해주세요.
        </div>
      </div>
    </section>
  </main>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
      <div class="spinner"></div>
      <p id="loadingText">조회 중입니다.</p>
    </div>
  </div>
</body>
</html>
