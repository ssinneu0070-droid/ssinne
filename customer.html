<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>씬느샵 주문조회</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><h1>♥ 씬느샵 주문조회</h1><p>수령인 성함과 연락처 뒤 4자리로 조회합니다.</p></header>
<main class="container">
<section class="card">
  <div class="grid grid-2">
    <div><label>수령인 성함</label><input id="receiver"></div>
    <div><label>연락처 뒤 4자리</label><input id="last4" maxlength="4" inputmode="numeric"></div>
  </div>
  <button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="lookup()">조회하기</button>
</section>
<section id="results"></section>
</main>
<script src="config.js"></script><script src="common.js"></script>
<script>
async function lookup(){
  try{
    const receiver=document.querySelector("#receiver").value.trim();
    const last4=document.querySelector("#last4").value.replace(/\D/g,"");
    const res=await api("lookupOrders",{receiver,last4});
    render(res.orders||[]);
  }catch(e){toast(e.message,"error")}
}
function badge(status){
  const cls=status==="입금완료"?"badge-paid":status==="카드결제"?"badge-card":status==="취소"?"badge-cancel":"badge-unpaid";
  return `<span class="badge ${cls}">${escapeHtml(status)}</span>`;
}
function render(orders){
  const box=document.querySelector("#results");
  if(!orders.length){box.innerHTML='<section class="card">조회된 주문이 없습니다.</section>';return}
  box.innerHTML=orders.map(o=>`
  <article class="order-card">
    <div class="row"><strong>주문번호 ${escapeHtml(o.orderId)}</strong>${badge(o.paymentStatus)}</div>
    <div class="row"><span>${escapeHtml(o.orderDate)}</span><strong>${money(o.amount)}</strong></div>
    <div style="white-space:pre-line;line-height:1.6">${escapeHtml(o.purchaseText)}</div>
    <div class="actions" style="margin-top:12px">
      ${o.canEdit?`<button class="btn btn-blue btn-sm" onclick='editOrder(${JSON.stringify(o)})'>주문 수정</button>
      <button class="btn btn-red btn-sm" onclick="cancelOrder('${escapeHtml(o.orderId)}')">주문 취소</button>`:""}
      ${o.trackingNumber?`<a target="_blank" class="btn btn-outline btn-sm" href="https://trace.cjlogistics.com/next/tracking.html?wblNo=${encodeURIComponent(o.trackingNumber)}">배송조회</a>`:""}
    </div>
  </article>`).join("");
}
async function cancelOrder(orderId){
  const reason=prompt("취소사유를 입력해 주세요.");
  if(reason===null)return;
  if(!confirm("미입금 주문을 취소하시겠습니까?"))return;
  try{await api("cancelOrder",{orderId,reason});toast("취소되었습니다.");lookup()}catch(e){toast(e.message,"error")}
}
async function editOrder(o){
  const memo=prompt("새 배송메모를 입력해 주세요.",o.memo||"");
  if(memo===null)return;
  try{await api("updateOrder",{orderId:o.orderId,memo});toast("수정되었습니다.");lookup()}catch(e){toast(e.message,"error")}
}
</script></body></html>
