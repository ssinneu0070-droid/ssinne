<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff4f97">
  <title>씬느샵 주문조회</title>
  <link rel="stylesheet" href="style.css?v=20260809-v3-6-stable">
  <script src="script.js?v=20260828-v4-18-lotte-tracking-desc" defer></script>
</head>
<body data-page="customer" class="page-customer">
  <header class="brand-header">
    <div class="brand-shell">
      <div class="brand-mark">S</div>
      <div class="brand-copy">
        <h1>씬느샵</h1>
        <p>Order Tracking</p>
      </div>
    </div>
  </header>

  <main class="page-shell lookup-shell">
    <section class="hero-card compact-hero">
      <div>
        <span class="eyebrow">ORDER LOOKUP</span>
        <h2>주문내역 조회</h2>
        <p>오늘 주문과 지난 주문을 함께 검색해 최신순으로 보여드립니다.</p>
      </div>
    </section>

    <section class="lookup-card">
      <div class="form-grid two">
        <div class="field">
          <label for="lookupName">수령인 성함</label>
          <input id="lookupName" type="text" placeholder="예: 유영인">
        </div>

        <div class="field">
          <label for="lookupPhoneLast">연락처 뒤 4자리</label>
          <input id="lookupPhoneLast" type="text" inputmode="numeric"
                 maxlength="4" placeholder="예: 6337">
        </div>
      </div>

      <button type="button" class="btn btn-primary full-width lookup-submit-button" id="lookupButton">
        주문 조회하기
      </button>
    </section>

    <section id="lookupResultSection" class="lookup-results">
      <div class="result-head">
        <div>
          <span class="eyebrow">MY ORDERS</span>
          <h2>주문내역</h2>
        </div>
        <span class="result-count" id="lookupCount">0건</span>
      </div>

      <div id="customerOrderList">
        <div class="empty-state">
          수령인 성함과 연락처 뒤 4자리를 입력해주세요.
        </div>
      </div>
    </section>
  </main>


  <div class="v2-modal" id="customerEditModal" aria-hidden="true">
    <div class="v2-modal-card">
      <button class="v2-modal-close" type="button" id="closeCustomerEdit">×</button>
      <h2>주문 수정</h2><p class="modal-help">미입금 주문만 수정할 수 있습니다.</p>
      <input type="hidden" id="editOrderNumber">
      <div class="form-grid two">
        <div class="field"><label>닉네임</label><input id="editNickname"></div>
        <div class="field"><label>수령인</label><input id="editReceiverName"></div>
        <div class="field"><label>연락처</label><input id="editPhone" inputmode="numeric"></div>
        <div class="field"><label>우편번호</label><input id="editZipcode"></div>
        <div class="field full"><label>주소</label><input id="editAddress"></div>
        <div class="field full"><label>배송메모</label><input id="editShippingMemo"></div>
      </div>

      <section class="edit-products-section">
        <div class="edit-section-head">
          <div>
            <h3>주문 상품 수정</h3>
            <p>수량·칼라·사이즈를 바꾸거나 상품을 삭제할 수 있습니다.</p>
          </div>
          <strong id="editProductsTotal">0원</strong>
        </div>

        <div id="editProductList" class="edit-product-list"></div>

        <div class="edit-product-add">
          <h4>상품 추가</h4>
          <div class="edit-add-grid">
            <div class="field">
              <label for="editAddProductNo">상품번호</label>
              <div class="edit-search-row">
                <input id="editAddProductNo" type="text" inputmode="numeric" maxlength="3" placeholder="상품번호">
                <button type="button" class="btn btn-subtle" id="editAddSearchButton">검색</button>
              </div>
            </div>
            <div class="field"><label>상품명</label><input id="editAddProductName" readonly></div>
            <div class="field"><label>칼라</label><select id="editAddColor" disabled><option value="">칼라 선택</option></select></div>
            <div class="field"><label>사이즈</label><select id="editAddSize" disabled><option value="">사이즈 선택</option></select></div>
            <div class="field"><label>수량</label><input id="editAddQuantity" type="number" min="1" max="99" value="1"></div>
          </div>
          <button type="button" class="btn btn-outline full-width" id="editAddProductButton">＋ 주문 상품 추가</button>
          <p class="edit-product-message" id="editAddMessage">상품번호를 검색해주세요.</p>
        </div>
      </section>

      <button class="btn btn-primary full-width" type="button" id="saveCustomerEdit">수정 내용 저장</button>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
      <div class="spinner"></div>
      <p id="loadingText">조회 중입니다.</p>
    </div>
  </div>
</body>
</html>
