<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>씬느샵 라이브 상품 모음</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#fafafa;color:#222}.header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #eee}.header-inner{max-width:1100px;margin:auto;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.logo{font-size:25px;font-weight:900}.nav{display:flex;gap:20px}.nav a{text-decoration:none;color:#222;font-weight:700}.cart{font-size:23px;position:relative}.cart span{position:absolute;top:-8px;right:-10px;background:#ef4f75;color:#fff;width:20px;height:20px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center}.hero{max-width:1100px;margin:0 auto;background:linear-gradient(90deg,#fff1f4,#f7efe6);min-height:190px;display:flex;align-items:center;justify-content:space-between;padding:32px 42px}.badge{display:inline-block;background:#ef4f75;color:white;font-weight:900;padding:7px 12px;border-radius:8px;margin-bottom:14px}.hero h1{font-size:36px;margin:0 0 12px;line-height:1.2}.hero p{font-size:16px;line-height:1.6;margin:0}.tabs{max-width:1100px;margin:18px auto;background:#fff;border-radius:12px;display:flex;gap:8px;padding:12px;border:1px solid #eee}.tab{border:0;background:transparent;padding:11px 18px;border-radius:9px;cursor:pointer;font-size:15px}.tab.active{background:#222;color:#fff;font-weight:900}.product-wrap{max-width:1100px;margin:0 auto 30px;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.04)}.status{display:inline-block;padding:7px 10px;border-radius:999px;font-size:13px;color:#fff;font-weight:900}.status.sale{background:#ef4f75}.status.soldout{background:#666}.status.end{background:#999}.product-no{color:#777;font-size:14px;margin-top:13px}.name{font-size:22px;font-weight:900;margin:8px 0}.detail{font-size:14px;line-height:1.7;color:#444}.desc{font-size:13px;color:#777;margin-top:8px;line-height:1.5}.price{margin-top:12px;font-size:24px;font-weight:900;color:#ef4f75}.order-btn{width:100%;margin-top:14px;border:none;border-radius:10px;padding:13px;background:#ef4f75;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.order-btn:disabled{background:#bbb;cursor:not-allowed}.notice{max-width:1100px;margin:0 auto 35px;background:#fff3f5;border:1px solid #ffd6df;border-radius:12px;padding:18px;font-size:14px;line-height:1.8}.loading{max-width:1100px;margin:30px auto;text-align:center;color:#777}.bottom-nav{display:none}@media(max-width:768px){body{padding-bottom:72px}.header-inner{height:58px}.logo{font-size:22px}.nav{display:none}.hero{margin:0 12px;min-height:160px;padding:24px 20px;border-radius:18px}.hero h1{font-size:27px}.hero p{font-size:14px}.tabs{margin:14px 12px;overflow-x:auto;white-space:nowrap}.tab{min-width:86px;font-size:14px}.product-wrap{margin:0 12px 20px;grid-template-columns:1fr;gap:12px}.card{padding:16px}.name{font-size:20px}.price{font-size:22px}.notice{margin:0 12px 20px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;z-index:20}.bottom-nav a{text-decoration:none;color:#555;font-size:12px;text-align:center}.bottom-nav b{display:block;font-size:20px;margin-bottom:2px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="logo">씬느샵</div><nav class="nav"><a href="#">라이브상품</a><a href="index.html">주문서</a><a href="customer.html">주문조회</a></nav><div class="cart">🛒<span id="saleCount">0</span></div></div></header>
<section class="hero"><div><span class="badge">LIVE</span><h1>라이브 방송<br>상품 모음</h1><p>상품번호를 확인하고<br>바로 주문서를 작성하세요.</p></div></section>
<div class="tabs"><button class="tab active" onclick="filterProducts('전체',this)">전체상품</button><button class="tab" onclick="filterProducts('판매중',this)">판매중</button><button class="tab" onclick="filterProducts('품절',this)">품절</button><button class="tab" onclick="filterProducts('마감',this)">마감</button></div>
<div class="loading" id="loading">상품을 불러오는 중입니다...</div><main class="product-wrap" id="productList"></main>
<div class="notice"><b>안내사항</b><br>· 품절/마감 상품은 주문이 불가능합니다.<br>· 주문하기를 누르면 주문서에 상품정보가 자동으로 들어갑니다.</div>
<nav class="bottom-nav"><a href="shop.html"><b>🏠</b>상품</a><a href="index.html"><b>📝</b>주문서</a><a href="customer.html"><b>🔎</b>조회</a><a href="#"><b>💬</b>문의</a></nav>
<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbycRpihssGhbRJR_1BNdB1fkDgovehoDrE9SPRPiRjmMmhI9Ut3wLA_zllFiymEXpQa/exec";let products=[];let currentFilter='전체';
async function loadProducts(){const loading=document.getElementById('loading');try{const res=await fetch(WEB_APP_URL+'?action=products');const data=await res.json();if(!data.success)throw new Error(data.message||'상품 불러오기 실패');products=data.products||[];loading.style.display='none';renderProducts();}catch(e){loading.innerHTML='상품을 불러오지 못했습니다.<br>Apps Script 배포 또는 products 시트를 확인해주세요.';console.error(e);}}
function renderProducts(){const list=document.getElementById('productList');list.innerHTML='';const filtered=currentFilter==='전체'?products:products.filter(p=>p.status===currentFilter);document.getElementById('saleCount').textContent=products.filter(p=>p.status==='판매중').length;if(!filtered.length){list.innerHTML="<div style='grid-column:1/-1;text-align:center;background:#fff;border-radius:14px;padding:40px;color:#777;'>표시할 상품이 없습니다.</div>";return;}filtered.forEach(product=>{const disabled=product.status!=='판매중';const statusClass=product.status==='판매중'?'sale':product.status==='품절'?'soldout':'end';const card=document.createElement('div');card.className='card';card.innerHTML=`<span class="status ${statusClass}">${escapeHtml(product.status||'판매중')}</span><div class="product-no">상품번호 ${escapeHtml(product.no||'')}</div><div class="name">${escapeHtml(product.name||'')}</div><div class="detail">색상 : ${escapeHtml(product.color||'-')}<br>사이즈 : ${escapeHtml(product.size||'-')}</div>${product.desc?`<div class="desc">${escapeHtml(product.desc)}</div>`:''}<div class="price">${money(product.price)}원</div><button class="order-btn" ${disabled?'disabled':''} onclick="goOrder('${escapeAttr(product.no)}')">${disabled?escapeHtml(product.status):'🛒 주문하기'}</button>`;list.appendChild(card);});}
function filterProducts(status,button){currentFilter=status;document.querySelectorAll('.tab').forEach(btn=>btn.classList.remove('active'));button.classList.add('active');renderProducts();}
function goOrder(productNo){const p=products.find(x=>String(x.no)===String(productNo));if(!p)return;const params=new URLSearchParams({productNo:p.no||'',productName:p.name||'',color:p.color||'',size:p.size||'',price:String(p.price||'')});location.href='index.html?'+params.toString();}
function escapeHtml(text){return String(text??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}function escapeAttr(text){return String(text??'').replaceAll("'","\\'");}function money(v){return (Number(String(v||'0').replace(/[^0-9]/g,''))||0).toLocaleString();}loadProducts();
</script>
</body>
</html>
