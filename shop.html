<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>씬느샵 방송상품</title>

<style>
body{margin:0;font-family:sans-serif;background:#f6f7f9;color:#111827;}
.header{background:white;padding:24px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:26px;font-weight:900;}
.menu{font-size:34px;color:#6b7280;}
.search-box{background:white;padding:20px;border-bottom:1px solid #eee;}
.search-box input{width:100%;padding:20px;border:none;border-radius:18px;background:#f1f2f5;font-size:18px;box-sizing:border-box;}
.product-row{display:grid;grid-template-columns:1fr 100px 80px;gap:10px;align-items:center;background:white;padding:22px 20px;border-bottom:1px solid #eee;}
.product-name{font-size:21px;font-weight:800;line-height:1.4;}
.product-price{font-size:21px;font-weight:900;text-align:right;}
.copy-btn{border:1px solid #ddd;background:white;border-radius:14px;padding:10px;font-size:15px;font-weight:800;}
.loading{text-align:center;padding:40px;color:#777;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:14px 20px;border-radius:999px;display:none;font-weight:800;}
@media(max-width:600px){
.product-row{grid-template-columns:1fr 90px 72px;}
.product-name{font-size:18px;}
.product-price{font-size:18px;}
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">🛍 씬느샵 방송상품</div>
    <div class="menu">☰</div>
</div>

<div class="search-box">
    <input id="searchInput" placeholder="🔍 상품명 또는 번호 검색..." oninput="searchProducts()">
</div>

<div id="loading" class="loading">상품을 불러오는 중입니다...</div>
<div id="productList"></div>
<div id="toast" class="toast">복사되었습니다</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbytWAzutc_KkaqJs563XkX1rh_Lx8zHHN__4RAHfkwqfkUD613-kIbJDlMWL01xBpTg/exec";

let allProducts = [];

async function loadProducts(){
    const res = await fetch(SCRIPT_URL);
    const products = await res.json();

    allProducts = Array.isArray(products) ? products.reverse() : [];

    document.getElementById('loading').style.display = 'none';
    renderProducts(allProducts);
}

function renderProducts(products){
    const productList = document.getElementById('productList');
    productList.innerHTML = '';

    products.forEach(product => {
        const name =
            `${product.productCode || ''} ${product.productName || ''} ${product.color || ''} ${product.size || ''}`.trim();

        const price =
            Number(product.salePrice || 0).toLocaleString();

        productList.innerHTML += `
            <div class="product-row">
                <div class="product-name">${name}</div>
                <div class="product-price">${price}</div>
                <button class="copy-btn" onclick="copyProduct('${name}', '${price}')">복사</button>
            </div>
        `;
    });
}

function searchProducts(){
    const keyword = document.getElementById('searchInput').value.trim();

    const filtered = allProducts.filter(product => {
        const text =
            `${product.productCode || ''} ${product.productName || ''} ${product.color || ''} ${product.size || ''}`;

        return text.includes(keyword);
    });

    renderProducts(filtered);
}

function copyProduct(name, price){
    const text = `${name} ${price}원`;

    navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 1400);
    });
}

loadProducts();
</script>

</body>
</html>
