<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>씬느샵 방송상품</title>

<style>

body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
}

.header{
    background:white;
    padding:20px;
    font-size:28px;
    font-weight:900;
}

.search{
    padding:20px;
    background:white;
}

.search input{
    width:100%;
    padding:18px;
    border:none;
    border-radius:18px;
    background:#f1f1f1;
    font-size:17px;
    box-sizing:border-box;
}

.product{
    display:grid;
    grid-template-columns:1fr 90px 80px;
    gap:10px;
    align-items:center;
    background:white;
    padding:20px;
    border-top:1px solid #eee;
}

.name{
    font-size:20px;
    font-weight:800;
}

.price{
    text-align:right;
    font-size:20px;
    font-weight:900;
}

.copy{
    border:none;
    background:#111827;
    color:white;
    padding:12px;
    border-radius:12px;
    font-weight:800;
}

</style>
</head>

<body>

<div class="header">
🛍 씬느샵 방송상품
</div>

<div class="search">

<input
    id="search"
    placeholder="상품명 또는 번호 검색..."
    oninput="searchProducts()"
>

</div>

<div id="list"></div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzU09nalOfkUfkd9mno80hKizj0d2kdzoy9oNrXC4FBIlVKxzVSbxPHhiXWoMKz2sZU/exec";

let allProducts = [];

async function loadProducts(){

    const res =
        await fetch(SCRIPT_URL);

    const data =
        await res.json();

    allProducts = data.reverse();

    renderProducts(allProducts);

}

function renderProducts(products){

    const list =
        document.getElementById('list');

    list.innerHTML = '';

    products.forEach(product => {

        const text =
            `${product.productCode} ${product.productName} ${product.color} ${product.size}`;

        const price =
            Number(product.salePrice)
            .toLocaleString();

        list.innerHTML += `

        <div class="product">

            <div class="name">
                ${text}
            </div>

            <div class="price">
                ${price}
            </div>

            <button
                class="copy"
                onclick="copyText('${text} ${price}원')"
            >
                복사
            </button>

        </div>

        `;

    });

}

function searchProducts(){

    const keyword =
        document.getElementById('search')
        .value;

    const filtered =
        allProducts.filter(product => {

            const text =
                `${product.productCode} ${product.productName} ${product.color} ${product.size}`;

            return text.includes(keyword);

        });

    renderProducts(filtered);

}

function copyText(text){

    navigator.clipboard.writeText(text);

    alert('복사되었습니다');

}

loadProducts();

</script>

</body>
</html>
