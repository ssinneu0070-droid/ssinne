<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>씬느샵 방송상품</title>

<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5;color:#111827;}
.header{background:white;padding:22px 20px;font-size:26px;font-weight:900;border-bottom:1px solid #eee;}
.search{background:white;padding:20px;border-bottom:1px solid #eee;}
.search input{width:100%;padding:18px;border:none;border-radius:18px;background:#f1f1f1;font-size:17px;box-sizing:border-box;}
.product{display:grid;grid-template-columns:1fr 90px 75px;gap:10px;align-items:center;background:white;padding:20px;border-bottom:1px solid #eee;}
.name{font-size:18px;font-weight:800;line-height:1.5;}
.price{text-align:right;font-size:18px;font-weight:900;}
.copy{border:1px solid #ddd;background:white;border-radius:12px;padding:10px;font-weight:800;}
.loading{text-align:center;padding:40px;color:#777;}
</style>
</head>

<body>

<div class="header">🛍 씬느샵 방송상품</div>

<div class="search">
<input id="search" placeholder="🔍 상품명 또는 번호 검색..." oninput="searchProducts()">
</div>

<div id="list">
  <div class="loading">상품을 불러오는 중입니다...</div>
</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzmMzVZjiso965oG3KikDcmCF3783l5pokhnJU4ACzBxhj1oT18659Vj8jCC4orVLJfxQ/exec";

let allProducts = [];

async function loadProducts(){
  const res = await fetch(SCRIPT_URL + "?type=products");
  const data = await res.json();

  allProducts = Array.isArray(data) ? data.reverse() : [];
  renderProducts(allProducts);
}

function renderProducts(products){
  const list = document.getElementById('list');
  list.innerHTML = '';

  if(products.length === 0){
    list.innerHTML = '<div class="loading">등록된 상품이 없습니다.</div>';
    return;
  }

  products.forEach(product => {
    const text =
      `${product.productCode || ''}번 ${product.productName || ''} ${product.color || ''} ${product.size || ''}`.trim();

    const price =
      Number(product.salePrice || 0).toLocaleString();

    list.innerHTML += `
      <div class="product">
        <div class="name">${text}</div>
        <div class="price">${price}</div>
        <button class="copy" onclick="copyText('${text} ${price}원')">복사</button>
      </div>
    `;
  });
}

function searchProducts(){
  const keyword = document.getElementById('search').value.trim();

  const filtered = allProducts.filter(product => {
    const text =
      `${product.productCode || ''} ${product.productName || ''} ${product.color || ''} ${product.size || ''}`;

    return text.includes(keyword);
  });

  renderProducts(filtered);
}

function copyText(text){
  navigator.clipboard.writeText(text);
  alert('복사되었습니다');
}

loadProducts();
</script>

</body>
</html>
